version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: print_kiosk_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: print_kiosk_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: print_kiosk_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=print_kiosk_db
      - JWT_SECRET=super_secret_kiosk_key_2026
      - JWT_REFRESH_SECRET=super_secret_refresh_key_2026
    depends_on:
      - postgres
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: print_kiosk_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
